name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 00:00 UTC 自动喂养
  workflow_dispatch:        # 支持手动触发
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Mydxx
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate rain-quote card
        run: |
          QUOTES=(
            "你懂得越多，你就越像这个世界的孤儿。|龙族"
            "就算全世界都背叛你，我也会站在你身后，背叛全世界。|龙族"
            "十几岁的人说出的情话不是情话，可是，那是青春啊。|龙族"
            "我们用人生最好的年华做抵押，去担保一个说出来都会被人嘲笑的梦想。|龙族"
            "美好的东西总是短暂的，就像樱花，就像烟火，就像你。|龙族"
            "每个人心里都沉睡着一头龙，等一场唤醒它的暴雨。|龙族"
            "铁甲依然在！|九州缥缈录"
            "命运像战车，碾过我们的时候从不会减速。|九州缥缈录"
            "这个世界有很多事是不能回头的，比如梦，比如岁月，比如爱。|九州缥缈录"
            "世上有多少心比天高的人，最后都命比纸薄。|九州缥缈录"
            "我们都会死，可有些东西不会死。|九州缥缈录"
            "以血为誓，以铁为证。|天之炽"
            "我们并肩燃烧过，就不算白活这一场。|天之炽"
          )
          Q=${QUOTES[$RANDOM % ${#QUOTES[@]}]}
          LINE="${Q%%|*}"; SRC="${Q##*|}"
          esc() { echo "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
          L1=$(esc "${LINE:0:18}"); L2=$(esc "${LINE:18:18}"); L3=$(esc "${LINE:36:18}")
          NL=1; [ -n "${LINE:18}" ] && NL=2; [ -n "${LINE:36}" ] && NL=3
          MAXL=${#LINE}; [ $MAXL -gt 18 ] && MAXL=18
          W=$((MAXL*22+150)); H=$((78+NL*32))
          DELAYS=(-0.2s -0.7s -1.1s -0.5s -0.9s -0.3s -1.3s -0.8s)
          DROPS=""
          for i in $(seq 0 15); do
            X=$(( (i*173+37) % (W-60) + 30 ))
            DUR="1.$((70 + (i*13) % 40))s"
            DELAY=${DELAYS[$((i % 8))]}
            DROPS="$DROPS<line class=\"drop\" x1=\"$X\" y1=\"-30\" x2=\"$((X+7))\" y2=\"-4\" style=\"animation-duration:$DUR;animation-delay:$DELAY\"/>"
          done
          TY=55
          TEXTS=""
          [ -n "$L1" ] && TEXTS="$TEXTS<text x=\"60\" y=\"$TY\" font-size=\"21\" fill=\"#eafcff\" letter-spacing=\"2\" filter=\"url(#glow)\">$L1</text>"
          [ -n "$L2" ] && TEXTS="$TEXTS<text x=\"60\" y=\"$((TY+32))\" font-size=\"21\" fill=\"#eafcff\" letter-spacing=\"2\" filter=\"url(#glow)\">$L2</text>"
          [ -n "$L3" ] && TEXTS="$TEXTS<text x=\"60\" y=\"$((TY+64))\" font-size=\"21\" fill=\"#eafcff\" letter-spacing=\"2\" filter=\"url(#glow)\">$L3</text>"
          META_Y=$((TY+NL*32+16))
          cat > dist/poem.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="$W" height="$H" font-family="KaiTi, STKaiti, SimSun, serif">
            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#0d0221"/><stop offset="1" stop-color="#1a0b2e"/>
              </linearGradient>
              <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="2.2" result="b"/>
                <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
              </filter>
            </defs>
            <style>
              .drop{stroke:#7de3ff;stroke-width:1.4;stroke-linecap:round;animation-name:fall;animation-timing-function:linear;animation-iteration-count:infinite}
              @keyframes fall{0%{transform:translateY(0);opacity:0}12%{opacity:.75}100%{transform:translateY(${H}px);opacity:0}}
            </style>
            <rect width="$W" height="$H" fill="url(#bg)"/>
            $DROPS
            $TEXTS
            <text x="60" y="$META_Y" font-size="13" fill="#ff00d4" letter-spacing="3">——《$SRC》</text>
          </svg>
          EOF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
