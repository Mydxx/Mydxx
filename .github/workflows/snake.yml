name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # 每天 00:00 UTC 自动喂养
  workflow_dispatch:        # 支持手动触发
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Mydxx
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Generate poem card
        run: |
          JSON=$(curl -s --max-time 15 https://v1.jinrishici.com/all.json)
          LINE=$(echo "$JSON" | jq -r .content | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          META=$(echo "$JSON" | jq -r '"—— " + .author + "《" + .origin + "》"' | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          W=$(( ${#LINE} * 21 + 120 ))
          cat > dist/poem.svg <<EOF
          <svg xmlns="http://www.w3.org/2000/svg" width="$W" height="70">
            <text x="60" y="30" font-family="KaiTi, STKaiti, SimSun, serif" font-size="20" fill="#00fff7" letter-spacing="2">$LINE</text>
            <text x="60" y="56" font-family="serif" font-size="13" fill="#ff00d4">$META</text>
          </svg>
          EOF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
