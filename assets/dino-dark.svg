<svg width="840" height="186" viewBox="0 0 840 186" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Chrome Dino Runner - Click to Play">
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .dino-jump { animation: dinoJump 5.6s linear infinite; }
    .leg-a { animation: legStepA 0.22s steps(1, end) infinite; }
    .leg-b { animation: legStepB 0.22s steps(1, end) infinite; }
    .obs-1 { animation: moveObs1 5.6s linear infinite; }
    .obs-2 { animation: moveObs2 5.6s linear infinite; }
    .ground-track { animation: scrollGround 2.1s linear infinite; }
    .cloud-1 { animation: driftCloud1 18s linear infinite; }
    .cloud-2 { animation: driftCloud2 24s linear infinite; }
    .blink { animation: blinkDot 1.2s steps(2, start) infinite; }

    @keyframes dinoJump {
      0%, 31%   { transform: translateY(0px); }
      35%       { transform: translateY(-46px); }
      38.5%     { transform: translateY(-60px); }
      42%       { transform: translateY(-44px); }
      46%, 81%  { transform: translateY(0px); }
      85%       { transform: translateY(-48px); }
      88.5%     { transform: translateY(-62px); }
      92%       { transform: translateY(-46px); }
      96%, 100% { transform: translateY(0px); }
    }
    @keyframes legStepA { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes legStepB { 0% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes moveObs1 {
      0%     { transform: translateX(880px); opacity: 1; }
      50%    { transform: translateX(-120px); opacity: 1; }
      50.1%  { transform: translateX(880px); opacity: 0; }
      100%   { transform: translateX(880px); opacity: 0; }
    }
    @keyframes moveObs2 {
      0%     { transform: translateX(880px); opacity: 0; }
      49.9%  { transform: translateX(880px); opacity: 0; }
      50%    { transform: translateX(880px); opacity: 1; }
      100%   { transform: translateX(-120px); opacity: 1; }
    }
    @keyframes scrollGround {
      0%   { transform: translateX(0px); }
      100% { transform: translateX(-420px); }
    }
    @keyframes driftCloud1 {
      0%   { transform: translateX(860px); }
      100% { transform: translateX(-80px); }
    }
    @keyframes driftCloud2 {
      0%    { transform: translateX(520px); }
      60%   { transform: translateX(-80px); }
      60.1% { transform: translateX(860px); }
      100%  { transform: translateX(520px); }
    }
    @keyframes blinkDot { to { opacity: 0.25; } }
  </style>

