<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" font-family="'Courier New',monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00fff7"/>
      <stop offset=".5" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#ff00d4"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00fff7" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00fff7" stop-opacity=".18"/>
      <stop offset="1" stop-color="#00fff7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .cy{fill:#00fff7;animation:g1 2.7s infinite steps(1)}
    .mg{fill:#ff00d4;animation:g2 3.4s infinite steps(1)}
    .main{fill:#eafcff;animation:flick 4s infinite steps(1)}
    .sub{fill:url(#neon);letter-spacing:6px}
    .scanbar{animation:scan 5s linear infinite}
    @keyframes g1{0%,88%{transform:translate(0,0)}89%{transform:translate(-7px,3px)}92%{transform:translate(5px,-2px)}95%{transform:translate(-3px,1px)}100%{transform:translate(0,0)}}
    @keyframes g2{0%,90%{transform:translate(0,0)}91%{transform:translate(7px,-3px)}94%{transform:translate(-5px,2px)}97%{transform:translate(3px,-1px)}100%{transform:translate(0,0)}}
    @keyframes flick{0%,86%{opacity:1}87%{opacity:.35}89%{opacity:1}93%{opacity:.6}95%{opacity:1}}
    @keyframes scan{0%{transform:translateY(-60px)}100%{transform:translateY(240px)}}
  </style>

  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- 地平线网格 -->
  <g stroke="#7b2ff7" stroke-opacity=".28">
    <line x1="0" y1="160" x2="900" y2="160"/><line x1="0" y1="172" x2="900" y2="172"/>
    <line x1="0" y1="187" x2="900" y2="187"/><line x1="0" y1="205" x2="900" y2="205"/>
    <line x1="150" y1="160" x2="60" y2="220"/><line x1="300" y1="160" x2="240" y2="220"/>
    <line x1="450" y1="160" x2="450" y2="220"/><line x1="600" y1="160" x2="660" y2="220"/>
    <line x1="750" y1="160" x2="840" y2="220"/>
  </g>

  <!-- 四角取景框 -->
  <g stroke="#00fff7" stroke-width="2" fill="none" opacity=".8">
    <path d="M18 34 V18 H38"/><path d="M862 18 H882 V34"/>
    <path d="M882 186 V202 H862"/><path d="M38 202 H18 V186"/>
  </g>

  <!-- RGB 色散三层标题 -->
  <text x="450" y="118" text-anchor="middle" font-size="86" font-weight="bold" letter-spacing="14" class="cy">MYDXX</text>
  <text x="450" y="118" text-anchor="middle" font-size="86" font-weight="bold" letter-spacing="14" class="mg">MYDXX</text>
  <text x="450" y="118" text-anchor="middle" font-size="86" font-weight="bold" letter-spacing="14" class="main">MYDXX</text>

  <text x="450" y="148" text-anchor="middle" font-size="15" class="sub">// 以血为誓 · 以铁为证 //</text>

  <!-- 扫描线 -->
  <rect class="scanbar" width="900" height="46" fill="url(#scan)"/>
</svg>
