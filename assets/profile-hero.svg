<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mydxx - AI and Cyber Security">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07110F"/>
      <stop offset="0.55" stop-color="#081418"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="title" x1="90" y1="120" x2="520" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0FDF4"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22C55E"/>
      <stop offset="0.55" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22D3EE" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#94A3B8" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="22"/>
    </clipPath>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <circle cx="1040" cy="80" r="120" fill="#22D3EE" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="1110" cy="270" r="110" fill="#22C55E" fill-opacity="0.08" filter="url(#glow)"/>

  <g clip-path="url(#frame)">
    <rect x="0" width="1200" height="64" fill="url(#scan)">
      <animate attributeName="y" values="-64;320" dur="7s" repeatCount="indefinite"/>
    </rect>
    <rect x="2.5" width="2" height="16" rx="1" fill="#22D3EE" opacity="0">
      <animate attributeName="y" values="-20;320" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0;0" keyTimes="0;0.12;0.9;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="21" stroke="#94A3B8" stroke-opacity="0.18"/>
  <rect x="0" y="0" width="7" height="320" rx="3.5" fill="url(#accent)"/>

  <g transform="translate(48 36)">
    <circle cx="7" cy="7" r="6" fill="#F87171"/>
    <circle cx="29" cy="7" r="6" fill="#FBBF24"/>
    <circle cx="51" cy="7" r="6" fill="#4ADE80"/>
    <text x="76" y="13" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">mydxx@github: ~/profile</text>
    <circle cx="962" cy="8" r="3.5" fill="#22C55E">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1086" y="13" text-anchor="end" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">SYSTEM ONLINE</text>
  </g>

  <text x="48" y="112" fill="#22C55E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="2">$ whoami</text>
  <text x="48" y="186" fill="#22D3EE" fill-opacity="0.5" filter="url(#glowSoft)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="72" font-weight="700" letter-spacing="-2">Mydxx</text>
  <text x="47" y="186" fill="url(#title)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="72" font-weight="700" letter-spacing="-2">Mydxx</text>
  <text x="50" y="230" fill="#67E8F9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="25" font-weight="600" letter-spacing="4">AI × CYBER SECURITY</text>
  <text x="50" y="270" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Security tooling  /  Code audit  /  Agentic workflows</text>

  <text x="48" y="302" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">:: uptime <tspan fill="#4ADE80">5y</tspan> · repos <tspan fill="#4ADE80">15</tspan> · focus <tspan fill="#4ADE80">appsec / agentic</tspan></text>
  <text x="1152" y="302" text-anchor="end" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">exit_code 0 · awaiting<tspan fill="#4ADE80">_<animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></tspan></text>

  <g transform="translate(920 112)">
    <rect width="228" height="120" rx="14" fill="#0F172A" fill-opacity="0.78" stroke="#22D3EE" stroke-opacity="0.28"/>
    <text x="22" y="31" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">RESEARCH LOG</text>
    <rect x="194" y="23" width="3" height="8" fill="#22D3EE" opacity="0.8">
      <animate attributeName="height" values="8;16;10;8" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="23;15;21;23" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="200" y="19" width="3" height="12" fill="#22D3EE" opacity="0.8">
      <animate attributeName="height" values="12;6;14;12" dur="1.1s" begin="0.18s" repeatCount="indefinite"/>
      <animate attributeName="y" values="19;25;17;19" dur="1.1s" begin="0.18s" repeatCount="indefinite"/>
    </rect>
    <rect x="206" y="25" width="3" height="6" fill="#22D3EE" opacity="0.8">
      <animate attributeName="height" values="6;13;8;6" dur="1.1s" begin="0.36s" repeatCount="indefinite"/>
      <animate attributeName="y" values="25;18;23;25" dur="1.1s" begin="0.36s" repeatCount="indefinite"/>
    </rect>
    <text x="22" y="61" fill="#4ADE80" opacity="0.45" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; observe
      <animate attributeName="opacity" values="0.45;1;1;0.45;0.45" keyTimes="0;0.08;0.3;0.38;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="22" y="85" fill="#67E8F9" opacity="0.45" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; build
      <animate attributeName="opacity" values="0.45;1;1;0.45;0.45" keyTimes="0;0.08;0.3;0.38;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </text>
    <text x="22" y="109" fill="#A5B4FC" opacity="0.45" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">&gt; defend
      <animate attributeName="opacity" values="0.45;1;1;0.45;0.45" keyTimes="0;0.08;0.3;0.38;1" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
    </text>
    <rect x="151" y="97" width="10" height="16" fill="#4ADE80">
      <animate attributeName="opacity" values="1;0.15;1" dur="1.4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
