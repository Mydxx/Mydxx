<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d0221"/>
      <stop offset="1" stop-color="#221238"/>
    </linearGradient>
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff00d4" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ff00d4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="refl2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00fff7" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00fff7" stop-opacity="0"/>
    </linearGradient>
    <filter id="g" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .drop{stroke:#8be9ff;stroke-width:1.2;opacity:.55;animation:fall linear infinite}
    @keyframes fall{0%{transform:translateY(-30px);opacity:0}15%{opacity:.55}100%{transform:translateY(250px);opacity:0}}
    .tw{animation:tw 4s infinite steps(1)}
    @keyframes tw{0%,60%{opacity:.9}70%,90%{opacity:.15}100%{opacity:.9}}
    .fl{animation:fl 7s infinite steps(1)}
    @keyframes fl{0%,70%{opacity:.85}75%,85%{opacity:.1}90%,100%{opacity:.85}}
  </style>

  <rect width="900" height="220" fill="url(#sky)"/>

  <!-- 星空 -->
  <g fill="#eafcff">
    <rect x="60" y="24" width="2" height="2"/><rect x="150" y="46" width="2" height="2" class="tw"/>
    <rect x="240" y="18" width="2" height="2"/><rect x="330" y="40" width="2" height="2"/>
    <rect x="420" y="22" width="2" height="2" class="tw"/><rect x="510" y="50" width="2" height="2"/>
    <rect x="600" y="20" width="2" height="2"/><rect x="700" y="38" width="2" height="2" class="tw"/>
    <rect x="800" y="26" width="2" height="2"/><rect x="860" y="54" width="2" height="2"/>
  </g>

  <!-- 远景楼群 -->
  <g fill="#1c1240">
    <rect x="0" y="110" width="70" height="70"/><rect x="80" y="90" width="60" height="90"/>
    <rect x="150" y="120" width="80" height="60"/><rect x="250" y="80" width="55" height="100"/>
    <rect x="330" y="105" width="75" height="75"/><rect x="430" y="95" width="50" height="85"/>
    <rect x="500" y="115" width="85" height="65"/><rect x="610" y="85" width="60" height="95"/>
    <rect x="700" y="110" width="70" height="70"/><rect x="800" y="95" width="100" height="85"/>
  </g>

  <!-- 近景楼群 -->
  <g fill="#0a0618">
    <rect x="30" y="130" width="80" height="60"/><rect x="130" y="70" width="70" height="120"/>
    <rect x="230" y="140" width="90" height="50"/><rect x="360" y="60" width="80" height="130"/>
    <rect x="470" y="135" width="75" height="55"/><rect x="560" y="75" width="85" height="115"/>
    <rect x="680" y="140" width="70" height="50"/><rect x="780" y="65" width="90" height="125"/>
  </g>

  <!-- 亮窗 -->
  <g fill="#00fff7" opacity=".8">
    <rect x="142" y="82" width="5" height="6"/><rect x="158" y="98" width="5" height="6"/>
    <rect x="142" y="118" width="5" height="6" class="fl"/><rect x="176" y="140" width="5" height="6"/>
    <rect x="375" y="74" width="5" height="6"/><rect x="395" y="90" width="5" height="6" class="fl"/>
    <rect x="415" y="118" width="5" height="6"/><rect x="375" y="140" width="5" height="6"/>
    <rect x="575" y="88" width="5" height="6" class="fl"/><rect x="600" y="110" width="5" height="6"/>
    <rect x="625" y="140" width="5" height="6"/><rect x="800" y="80" width="5" height="6"/>
    <rect x="825" y="104" width="5" height="6" class="fl"/><rect x="845" y="136" width="5" height="6"/>
  </g>
  <g fill="#ffd166" opacity=".75">
    <rect x="50" y="145" width="5" height="6"/><rect x="80" y="160" width="5" height="6"/>
    <rect x="250" y="152" width="5" height="6"/><rect x="490" y="150" width="5" height="6"/>
    <rect x="700" y="152" width="5" height="6" class="fl"/><rect x="155" y="160" width="5" height="6"/>
  </g>

  <!-- 霓虹招牌 -->
  <rect x="205" y="90" width="9" height="52" fill="#ff00d4" filter="url(#g)"/>
  <rect x="455" y="98" width="42" height="8" fill="#00fff7" filter="url(#g)"/>
  <rect x="655" y="100" width="9" height="44" fill="#ff00d4" filter="url(#g)" class="fl"/>

  <!-- 地面与反光 -->
  <rect x="0" y="190" width="900" height="30" fill="#08040f"/>
  <rect x="196" y="190" width="26" height="30" fill="url(#refl)"/>
  <rect x="450" y="190" width="52" height="30" fill="url(#refl2)"/>
  <rect x="648" y="190" width="24" height="30" fill="url(#refl)"/>

  <!-- 雨 -->
  <g>
    <line class="drop" x1="45" y1="0" x2="49" y2="18" style="animation-duration:1.1s;animation-delay:-.3s"/>
    <line class="drop" x1="120" y1="0" x2="124" y2="18" style="animation-duration:1.4s;animation-delay:-.9s"/>
    <line class="drop" x1="205" y1="0" x2="209" y2="18" style="animation-duration:1.2s;animation-delay:-.5s"/>
    <line class="drop" x1="290" y1="0" x2="294" y2="18" style="animation-duration:1.6s;animation-delay:-1.2s"/>
    <line class="drop" x1="370" y1="0" x2="374" y2="18" style="animation-duration:1.3s;animation-delay:-.2s"/>
    <line class="drop" x1="455" y1="0" x2="459" y2="18" style="animation-duration:1.5s;animation-delay:-.8s"/>
    <line class="drop" x1="540" y1="0" x2="544" y2="18" style="animation-duration:1.1s;animation-delay:-1.4s"/>
    <line class="drop" x1="625" y1="0" x2="629" y2="18" style="animation-duration:1.4s;animation-delay:-.6s"/>
    <line class="drop" x1="710" y1="0" x2="714" y2="18" style="animation-duration:1.2s;animation-delay:-1s"/>
    <line class="drop" x1="795" y1="0" x2="799" y2="18" style="animation-duration:1.6s;animation-delay:-.4s"/>
    <line class="drop" x1="870" y1="0" x2="874" y2="18" style="animation-duration:1.3s;animation-delay:-1.1s"/>
  </g>
</svg>
